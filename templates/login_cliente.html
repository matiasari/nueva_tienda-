<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Bazar Guille</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body style="background: #f5f6fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;">

<div style="background: white; padding: 30px; border-radius: 12px; max-width: 400px; width: 100%; box-shadow: var(--shadow);">
    <h2 style="text-align: center; margin-top: 0; color: #2c3e50;">🔑 Iniciar Sesión</h2>

    {% if error %}
        <div style="background: #f8d7da; color: #721c24; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; text-align: center;">
            {{ error }}
        </div>
    {% endif %}

    <form action="/cliente/login" method="POST">
        <div class="input-group" style="margin-bottom: 15px;">
            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Email:</label>
            <input type="email" name="email" required placeholder="tuemail@gmail.com" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc;">
        </div>

        <div class="input-group" style="margin-bottom: 20px;">
            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Contraseña:</label>
            <input type="password" name="password" required placeholder="******" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc;">
        </div>

        <button type="submit" class="btn-subir-banner" style="width: 100%; padding: 12px; font-size: 16px;">Ingresar</button>
    </form>

    <p style="text-align: center; margin-top: 20px; font-size: 14px;">
        ¿No tenés cuenta? <a href="/cliente/registro" style="color: #8e44ad; font-weight: bold;">Registrate para precios por mayor</a>
    </p>
</div>

</body>
</html>
